name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # A write-enabled deploy key scoped to this repository is required:
          # GITHUB_TOKEN cannot push upstream changes to workflow files.
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/Flowseal/tg-ws-proxy.git
          git fetch --no-tags upstream main

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge upstream/main --no-edit

      - name: Push changes
        run: |
          git push origin HEAD:main
